name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # main 에 push 되면 GitHub Pages 로 배포 → 설치된 앱들이 업데이터로 새 버전을 받습니다.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (+ 모바일 앱용 업데이트 번들)
        run: |
          VERSION=$(node -p "require('./app/version.json').version")
          mkdir -p _site/bundles
          cp -r app/. _site/
          (cd app && zip -qr "../_site/bundles/app-${VERSION}.zip" .)
          echo "version ${VERSION}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
